{% extends 'base.html' %}
{% block auth_content %}
<div class="auth-bg">
    <div class="glass-card" style="max-width:520px;">
        <a href="{{ url_for('login') }}" class="brand d-inline-flex mb-3" style="color:var(--dark);">
            <i class="bi bi-compass" style="color:var(--purple);"></i>GlobeTrotter
        </a>
        <h3>Create your account</h3>
        <p class="text-muted mb-4">Takes less than a minute</p>
        <form method="POST">
            <div class="row">
                <div class="col mb-3">
                    <label>First Name</label>
                    <input type="text" name="first_name" class="form-control" required>
                </div>
                <div class="col mb-3">
                    <label>Last Name</label>
                    <input type="text" name="last_name" class="form-control">
                </div>
            </div>
            <div class="row">
                <div class="col mb-3">
                    <label>Email Address</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="col mb-3">
                    <label>Phone Number</label>
                    <input type="text" name="phone" class="form-control">
                </div>
            </div>
            <div class="row">
                <div class="col mb-3">
                    <label>City</label>
                    <input type="text" name="city" class="form-control">
                </div>
                <div class="col mb-3">
                    <label>Country</label>
                    <input type="text" name="country" class="form-control">
                </div>
            </div>
            <div class="mb-4">
                <label>Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-purple w-100">Register</button>
        </form>
        <p class="text-center mt-4 mb-0 text-muted">
            Already have an account? <a href="{{ url_for('login') }}" style="color:var(--purple); font-weight:600;">Login</a>
        </p>
    </div>
</div>
{% endblock %}
