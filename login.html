{% extends 'base.html' %}
{% block content %}
<div class="auth-wrap">
    <div class="auth-side">
        <div class="dots"></div>
        <span class="eyebrow" style="color:rgba(255,255,255,0.7)">Welcome back</span>
        <h1 class="mt-2">Your next stamp<br>is waiting.</h1>
        <p class="mt-3">Plan trips, build day-wise itineraries and track your travel budget — all in one place.</p>
    </div>
    <div class="auth-form-side">
        <div class="auth-card">
            <div class="mb-4">
                <a href="{{ url_for('login') }}" class="brand" style="font-size:1.3rem;"><i class="bi bi-compass" style="color:var(--coral)"></i>GlobeTrotter</a>
            </div>
            <h3>Login</h3>
            <p class="text-muted mb-4">Enter your details to access your trips</p>
            <form method="POST">
                <div class="mb-3">
                    <label>Username or Email</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="mb-4">
                    <label>Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-teal w-100">Login</button>
            </form>
            <p class="text-center mt-4 mb-0 text-muted">
                New here? <a href="{{ url_for('register') }}" style="color:var(--teal); font-weight:600;">Create an account</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
